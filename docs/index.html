<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pubdoc — ドキュメント共有</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .docs-list {
      text-align: left;
      display: grid;
      gap: 12px;
    }
    .doc-item {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      transition: all 0.3s;
      cursor: pointer;
    }
    .doc-item:hover {
      background: #667eea;
      color: white;
      transform: translateX(4px);
    }
    .doc-item a {
      text-decoration: none;
      color: inherit;
      display: block;
      font-weight: 600;
    }
    .doc-item small {
      display: block;
      opacity: 0.7;
      margin-top: 4px;
      font-size: 12px;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 pubdoc</h1>
    <p class="subtitle">公開ドキュメント共有サーバー</p>

    <div class="docs-list">
      <div class="doc-item">
        <a href="/address-lore/address-lore-study-session.html">
          🎓 address-lore 勉強会
        </a>
        <small>40分勉強会スライド — スキーマ駆動開発</small>
      </div>
    </div>

    <div class="footer">
      <p>more docs coming soon...</p>
    </div>
  </div>
</body>
</html>
