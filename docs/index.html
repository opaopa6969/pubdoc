<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pubdoc</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      padding: 40px; max-width: 640px; width: 100%;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    .sub { color: #667; margin-bottom: 28px; font-size: 14px; }
    .area { display: block; text-decoration: none; color: inherit;
      background: #f7f8fa; border: 1px solid #e3e5ea; border-left: 4px solid #667eea;
      border-radius: 8px; padding: 18px; margin-bottom: 12px; transition: .2s; }
    .area:hover { background: #eef0ff; transform: translateX(3px); }
    .area h2 { font-size: 17px; margin-bottom: 4px; }
    .area p { font-size: 13px; color: #667; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px;
      vertical-align: middle; font-weight: 600; }
    .badge.open { background: #e6f7ed; color: #1a7f45; }
    .badge.lock { background: #fdecec; color: #b3261e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>pubdoc</h1>
    <p class="sub">ドキュメント・スライド共有</p>

    <a class="area" href="/public/">
      <h2>public<span class="badge open">ログイン不要</span></h2>
      <p>誰でも URL だけで開ける資料</p>
    </a>

    <a class="area" href="/private/">
      <h2>private<span class="badge lock">要ログイン</span></h2>
      <p>MEMBER 以上のみ。社内向け・非公開リポジトリ由来の資料</p>
    </a>
  </div>
</body>
</html>
