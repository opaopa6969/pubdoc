<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pubdoc / public</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.12);
      padding: 40px; max-width: 640px; width: 100%;
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: #667; margin-bottom: 24px; font-size: 14px; }
    .item { display: block; text-decoration: none; color: inherit;
      background: #f7f8fa; border: 1px solid #e3e5ea; border-left: 4px solid #1a7f45;
      border-radius: 8px; padding: 16px; margin-bottom: 10px; transition: .2s; }
    .item:hover { background: #eefaf2; transform: translateX(3px); }
    .item strong { display: block; font-size: 15px; }
    .item small { color: #667; font-size: 12px; }
    .empty { color: #889; font-size: 14px; padding: 24px; text-align: center;
      border: 1px dashed #d5d8de; border-radius: 8px; }
    .back { display: inline-block; margin-top: 20px; font-size: 13px; color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>public</h1>
    <p class="sub">ログイン不要で開ける資料</p>

    <div class="empty">まだ資料がありません</div>

    <a class="back" href="/">← pubdoc トップ</a>
  </div>
</body>
</html>
