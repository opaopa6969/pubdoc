version: "3.8"

services:
  pubdoc:
    build: .
    container_name: pubdoc
    ports:
      - "80:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
